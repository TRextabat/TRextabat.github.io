<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="cm-title cm-desc">
  <title id="cm-title">CiveMate</title>
  <desc id="cm-desc">A stylised tulip — CiveMate's mark, rooted in Turkish Iznik tile tradition. Terracotta outer petals frame a warm amber inner petal with a saffron seed.</desc>

  <!-- Left petal -->
  <path d="M 128 54
           C 92 54, 62 86, 66 132
           C 68 156, 82 176, 106 184
           C 118 164, 122 132, 128 108
           Z"
        fill="#E63946"/>

  <!-- Right petal — deeper terracotta for subtle depth -->
  <path d="M 128 54
           C 164 54, 194 86, 190 132
           C 188 156, 174 176, 150 184
           C 138 164, 134 132, 128 108
           Z"
        fill="#C92B39"/>

  <!-- Centre petal — warm amber -->
  <path d="M 128 70
           C 110 74, 102 98, 106 128
           C 108 152, 118 176, 128 192
           C 138 176, 148 152, 150 128
           C 154 98, 146 74, 128 70
           Z"
        fill="#F4A261"/>

  <!-- Saffron seed at the cultural heart -->
  <circle cx="128" cy="120" r="10" fill="#E9C46A"/>

  <!-- Teal stem grounding the flower -->
  <path d="M 128 192 C 128 208, 128 220, 128 234"
        stroke="#2A9D8F"
        stroke-width="5"
        stroke-linecap="round"
        fill="none"/>

  <!-- Small leaf -->
  <path d="M 128 214
           C 144 208, 152 216, 150 226
           C 140 226, 132 222, 128 218 Z"
        fill="#2A9D8F"/>
</svg>
