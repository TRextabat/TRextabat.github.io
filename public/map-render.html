<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CiveMate map render</title>
  <link href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; }
    html, body, #map { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { background: #e9e4d5; }
    .maplibregl-control-container { display: none; }
  </style>
</head>
<body>
  <div id="map"></div>
  <script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
  <script>
    window.renderReady = false;

    const map = new maplibregl.Map({
      container: 'map',
      style: 'https://tiles.openfreemap.org/styles/bright',
      center: [29.0248, 40.9871],
      zoom: 14.65,
      pitch: 52,
      bearing: -20,
      antialias: true,
      attributionControl: false
    });

    map.on('style.load', () => {
      const style = map.getStyle();

      style.layers.forEach((layer) => {
        const id = layer.id.toLowerCase();

        try {
          if (layer.type === 'background') {
            map.setPaintProperty(layer.id, 'background-color', '#e9e4d5');
          }

          if (layer.type === 'fill' && (id.includes('water') || id.includes('ocean'))) {
            map.setPaintProperty(layer.id, 'fill-color', '#6f9fbd');
          }

          if (layer.type === 'fill' && (id.includes('park') || id.includes('wood') || id.includes('grass'))) {
            map.setPaintProperty(layer.id, 'fill-color', '#9fbd91');
            map.setPaintProperty(layer.id, 'fill-opacity', 0.85);
          }

          if (layer.type === 'fill' && id.includes('building')) {
            map.setLayoutProperty(layer.id, 'visibility', 'none');
          }

          if (layer.type === 'line' && (id.includes('road') || id.includes('highway') || id.includes('street'))) {
            map.setPaintProperty(layer.id, 'line-color', '#f8edd8');
          }

          if (layer.type === 'symbol') {
            if (
              id.includes('poi') ||
              id.includes('transit') ||
              id.includes('bus') ||
              id.includes('rail') ||
              id.includes('airport') ||
              id.includes('housenumber')
            ) {
              map.setLayoutProperty(layer.id, 'visibility', 'none');
              return;
            }

            if (map.getPaintProperty(layer.id, 'icon-opacity') !== undefined) {
              map.setPaintProperty(layer.id, 'icon-opacity', 0);
            }

            if (map.getPaintProperty(layer.id, 'text-color') !== undefined) {
              map.setPaintProperty(layer.id, 'text-color', '#38342f');
              map.setPaintProperty(layer.id, 'text-halo-color', '#f8f1e5');
              map.setPaintProperty(layer.id, 'text-halo-width', 1.2);
            }
          }
        } catch {
          // Some source layers do not expose every property at all zoom levels.
        }
      });

      const firstLabel = style.layers.find((layer) => layer.type === 'symbol')?.id;
      map.addLayer({
        id: 'civemate-buildings-3d',
        type: 'fill-extrusion',
        source: 'openmaptiles',
        'source-layer': 'building',
        minzoom: 13,
        paint: {
          'fill-extrusion-color': [
            'interpolate',
            ['linear'],
            ['coalesce', ['get', 'render_height'], ['get', 'height'], 8],
            0, '#f1e6d4',
            18, '#e8d6bc',
            55, '#d8b185'
          ],
          'fill-extrusion-height': ['coalesce', ['get', 'render_height'], ['get', 'height'], 8],
          'fill-extrusion-base': ['coalesce', ['get', 'render_min_height'], 0],
          'fill-extrusion-opacity': 0.96,
          'fill-extrusion-vertical-gradient': true
        }
      }, firstLabel);
    });

    map.once('idle', () => {
      window.renderReady = true;
      document.body.dataset.ready = 'true';
    });
  </script>
</body>
</html>
