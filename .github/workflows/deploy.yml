name: Deploy CiveMate landing to Vercel

# Replaces the previous GitHub Pages deploy. Pages published a second, diverging
# copy of this site; civemate.com points at Vercel, so Pages was serving stale
# content to nobody. One host, one source of truth.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vercel-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://civemate.com
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      # Runs `npm run build`, which includes the SSR prerender step. If the
      # prerender fails the build fails here rather than silently shipping an
      # empty <div id="root"> that no AI crawler can read.
      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Verify prerender landed before deploying
        run: |
          FILE=.vercel/output/static/index.html
          test -f "$FILE" || { echo "::error::$FILE missing"; exit 1; }
          grep -q "cultural" "$FILE" || { echo "::error::build output has no prerendered copy"; exit 1; }
          echo "prerender OK: $(wc -c < "$FILE") bytes"

      - name: Deploy to production
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
