name: Neutralise GitHub Pages duplicate

# GitHub will not let a `username.github.io` user site be deactivated via API
# ("Deactivating GitHub pages for this repository is not allowed", HTTP 422).
# Left alone, Pages would keep serving the last artifact it built forever — a
# frozen duplicate of civemate.com competing with it in the search index.
#
# So instead of publishing the site here, publish a redirect stub that tells
# crawlers the canonical home is civemate.com and sends humans there. Crawling
# is deliberately allowed: a robots.txt Disallow would stop Google from ever
# seeing the noindex and canonical, leaving the old URL indexed indefinitely.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  redirect:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Build redirect stub
        run: |
          mkdir -p stub
          cat > stub/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="UTF-8" />
              <title>CiveMate has moved to civemate.com</title>
              <meta name="robots" content="noindex, follow" />
              <link rel="canonical" href="https://civemate.com/" />
              <meta http-equiv="refresh" content="0; url=https://civemate.com/" />
              <style>
                body { font-family: system-ui, sans-serif; background: #f2e9d8; color: #191713;
                       display: grid; place-items: center; height: 100vh; margin: 0; text-align: center; }
                a { color: #3155c6; }
              </style>
            </head>
            <body>
              <main>
                <h1>CiveMate lives at civemate.com</h1>
                <p>Redirecting you now — or <a href="https://civemate.com/">go there directly</a>.</p>
              </main>
              <script>location.replace('https://civemate.com/')</script>
            </body>
          </html>
          HTML
          cat > stub/robots.txt <<'TXT'
          # Crawling is allowed on purpose so the noindex + canonical on / can be
          # read. The real robots.txt lives at https://civemate.com/robots.txt
          User-agent: *
          Allow: /
          Sitemap: https://civemate.com/sitemap.xml
          TXT

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: stub
      - id: deployment
        uses: actions/deploy-pages@v4
